name: PHP compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    container: php:8.2.35-cli
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Check behavior
        run: true
